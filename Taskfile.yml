version: '3'

vars:
  APP_NAME: "Seaglass"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  GOOS: '{{.GOOS | default OS}}'
  # Version shown in the app; release builds pass VERSION=v0.1.0.
  VERSION: '{{.VERSION | default "dev"}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  installer:
    summary: Builds the installer, bin/Seaglass-setup.exe (needs NSIS; pass VERSION=v1.2.3)
    cmds:
      - task: build
      - wails3 generate webview2bootstrapper -dir build/windows/nsis
      - '"{{.MAKENSIS}}" -V2 -DARG_WAILS_AMD64_BINARY="{{fromSlash .ROOT_DIR}}\{{.BIN_DIR}}\{{.APP_NAME}}.exe" -DINFO_PRODUCTVERSION={{.NUM}} build/windows/nsis/project.nsi'
    vars:
      MAKENSIS: '{{.MAKENSIS | default "makensis"}}'
      # 1.2.3 for VERSION=v1.2.3 (NSIS wants plain numbers); 0.0.0 for dev builds.
      NUM: '{{if hasPrefix "v" .VERSION}}{{regexReplaceAll "[-+].*$" (trimPrefix "v" .VERSION) ""}}{{else}}0.0.0{{end}}'
